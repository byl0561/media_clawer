<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9D8DF8"/>
      <stop offset="100%" stop-color="#5A47C4"/>
    </linearGradient>
  </defs>
  <!-- 背景 -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- 顶部内发光 -->
  <rect width="32" height="32" rx="7" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="1"/>
  <!-- 已有媒体卡（实心）-->
  <rect x="2.5" y="6" width="11" height="20" rx="2.5" fill="white" opacity="0.92"/>
  <!-- 卡内内容线 -->
  <line x1="5" y1="12" x2="11.5" y2="12" stroke="#7C6FE8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="5" y1="15.5" x2="9.5" y2="15.5" stroke="#7C6FE8" stroke-width="1.5" stroke-linecap="round"/>
  <!-- 缺口三点 -->
  <circle cx="15.5" cy="16" r="1.1" fill="white" opacity="0.5"/>
  <circle cx="18.5" cy="16" r="1.1" fill="white" opacity="0.5"/>
  <!-- 缺失媒体卡（虚线轮廓）-->
  <rect x="21.5" y="6" width="8" height="20" rx="2" stroke="white" stroke-width="1.8"
    stroke-dasharray="3 2.5" fill="none" opacity="0.55"/>
</svg>
